<div class="app">
  <nav class="rail">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 9.5 12 14 15.5 20 7"/><circle cx="20" cy="7" r="1.9" fill="currentColor" stroke="none"/></svg></div>
    <div class="rail-nav" id="nav"></div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="wordmark">FLEET<b>VIEW</b> <span class="arrow">→|</span></div>

      <div class="pod">
        <div class="ic" style="color:var(--green)"><svg><use href="#i-server"/></svg></div>
        <div><div class="k">在线服务</div><div class="v" id="podServices">—</div></div>
      </div>

      <div class="pod">
        <div class="ic" style="color:var(--blue)"><svg><use href="#i-pulse"/></svg></div>
        <div><div class="k">调用 · <span id="podRangeLabel">24H</span></div><div class="v" id="podCalls">—</div></div>
      </div>

      <div class="pod">
        <div class="ic" style="color:var(--red)"><svg><use href="#i-zap"/></svg></div>
        <div><div class="k">首词中位</div><div class="v" id="podTtft">—</div></div>
      </div>

      <div class="top-right">
        <div class="risk">
          <span class="up-arrow">↗</span>
          <div class="k">服务健康</div>
          <div class="v"><span class="ring" id="healthRing"></span><span id="healthText">检测中</span></div>
        </div>
        <div class="risk" style="min-width:104px">
          <div class="k">最近检查</div>
          <div class="v mono" id="lastCheck">—</div>
        </div>
        <button class="theme-btn" id="themeBtn" title="切换深色 / 浅色">
          <svg class="t-adjust"><use href="#i-adjust"/></svg>
        </button>
      </div>
    </header>

    <div class="scroll" id="view"></div>
  </div>
</div>

<div class="tooltip" id="tip"></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
